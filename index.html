<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Govinda 247 - Get Your ID</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* CSS YAHAN HAI */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        
        body {
            background: #000 url('https://www.transparenttextures.com/patterns/dark-matter.png');
            background-color: #0b1a13;
            color: white;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
            padding: 30px 15px;
            background: radial-gradient(circle at top, #1a3a2a 0%, #000 70%);
        }

        .logo-box { margin-bottom: 20px; }
        .logo-box h2 { color: #f1c40f; font-size: 28px; letter-spacing: 2px; text-shadow: 0 0 10px #f1c40f; }
        .tagline { font-size: 10px; letter-spacing: 3px; color: #aaa; margin-top: 5px; }

        .hero-title { font-size: 30px; font-weight: 900; margin: 25px 0; line-height: 1.2; }
        .hero-title span { color: #2ecc71; }

        .info-bar { font-size: 11px; color: #888; margin-bottom: 30px; font-weight: bold; }

        .bonus-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            font-weight: bold;
        }
        .card i { font-size: 20px; color: #f1c40f; }

        .card.full { grid-column: span 2; justify-content: center; background: rgba(241, 196, 15, 0.1); border-color: #f1c40f; }

        .cta-box { margin-top: 40px; }

        .whatsapp-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(180deg, #2ecc71, #27ae60);
            color: white;
            text-decoration: none;
            padding: 18px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(46, 204, 113, 0.3);
            animation: pulse 1.5s infinite;
            border: 2px solid rgba(255,255,255,0.2);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .stats { margin-top: 20px; color: #2ecc71; font-size: 13px; font-weight: bold; }
        .limited { color: #e74c3c; font-size: 11px; margin-top: 5px; }

        /* Notification Popup */
        #popup {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            color: black;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: none;
            z-index: 100;
            width: 90%;
            max-width: 350px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-box">
            <h2>GOVINDA<span style="color:white">247</span></h2>
            <p class="tagline">INDIA'S TOP GAMING ID PLATFORM</p>
        </div>

        <div class="hero-title">
            PLAY. <span>WIN.</span> CASH OUT.
        </div>

        <div class="info-bar">
            3000+ GAMES &bull; INSTANT CASHOUT &bull; 24/7 SUPPORT
        </div>

        <div class="bonus-grid">
            <div class="card">
<i class="fas fa-gift"></i>
                <span>15% WELCOME BONUS</span>
            </div>
            <div class="card">
                <i class="fas fa-coins"></i>
                <span>50 FREE SPINS</span>
            </div>
            <div class="card full">
                <i class="fas fa-wallet"></i>
                <span>10% DEPOSIT BONUS</span>
            </div>
        </div>

        <div class="cta-box">
            <a href="https://wa.me/9133557532" class="whatsapp-btn" id="subEvent">
                <i class="fab fa-whatsapp" style="font-size: 25px;"></i> GET YOUR ID ON WHATSAPP
            </a>
            <p class="stats">✓ 1,084 players claimed bonus today</p>
            <p class="limited">⚠️ Limited-time bonus active now</p>
        </div>
    </div>

    <div id="popup"></div>

    <script>
        // JAVASCRIPT YAHAN HAI
        
        // 1. WhatsApp Click Tracking (Subscribe Event)
        document.getElementById('subEvent').onclick = function() {
            console.log("Event: Subscribe/WhatsApp Clicked");
            // Aap yahan apne tracking pixels (FB/Google) daal sakte hain
        };

        // 2. Dynamic Notifications (Sanjay from Jaipur style)
        const users = ["Rahul from Delhi", "Arjun from Punjab", "Sanjay from Jaipur", "Priya from Mumbai", "Amit from Indore"];
        const wins = ["just created a new ID", "won ₹25,000 on Cricket", "withdrew ₹10,000 instantly", "claimed a 100% bonus"];

        function showPopup() {
            const popup = document.getElementById('popup');
            const randomUser = users[Math.floor(Math.random() * users.length)];
            const randomWin = wins[Math.floor(Math.random() * wins.length)];
            
            popup.innerHTML = 🔥 ${randomUser} ${randomWin};
            popup.style.display = 'block';

            setTimeout(() => {
                popup.style.display = 'none';
            }, 3000);
        }

        // Har 6 second mein popup dikhayega
        setInterval(showPopup, 6000);
        setTimeout(showPopup, 2000); // Pehla popup 2 second baad
    </script>
</body>
</html>
