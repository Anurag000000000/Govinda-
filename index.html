<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuberCric - India's Top Gaming ID</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="main-container">
        <div class="logo-section">
            <img src="https://i.ibb.co/v4yZgS6/kuber-logo.png" alt="KuberCric Logo" class="logo">
            <p class="tagline">INDIA'S TOP GAMING ID PLATFORM</p>
        </div>

        <div class="hero-text">
            <h1>PLAY. <span>WIN.</span> CASH OUT.</h1>
            <div class="features">
                <span>3000+ GAMES</span> • <span>INSTANT CASHOUT</span> • <span>24/7 SUPPORT</span>
            </div>
        </div>

        <div class="bonus-container">
            <div class="bonus-card">
                <img src="https://cdn-icons-png.flaticon.com/512/1041/1041888.png" alt="bonus">
                <p>10% WELCOME BONUS</p>
            </div>
            <div class="bonus-card">
                <img src="https://cdn-icons-png.flaticon.com/512/2654/2654416.png" alt="spins">
                <p>50 FREE SPINS</p>
            </div>
            <div class="bonus-card deposit">
                <img src="https://cdn-icons-png.flaticon.com/512/2489/2489756.png" alt="deposit">
                <p>2% DEPOSIT BONUS</p>
            </div>
        </div>

        <div class="cta-section">
            <a href="https://wa.me/YOUR_NUMBER" class="whatsapp-btn" id="subscribeBtn">
                <i class="fab fa-whatsapp"></i> GET YOUR ID ON WHATSAPP
            </a>
            <p class="claim-text">1,084 players claimed their bonus today</p>
            <p class="limited-offer">🔥 Limited-time bonus active now</p>
        </div>

        <div id="notification" class="notification">
            <span id="notif-text"></span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
